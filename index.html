<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44, #1e1e2f);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(3rem, 12vw, 9rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 2.5s ease-in-out infinite;
        }

        .dot {
            color: #6c63ff;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.03);
            }
        }

        p {
            margin-top: 20px;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #a0a0b8;
            letter-spacing: 2px;
        }

        .line {
            width: 80px;
            height: 3px;
            background: #6c63ff;
            margin: 30px auto 0;
            border-radius: 2px;
            animation: expand 2s ease-in-out infinite;
        }

        @keyframes expand {
            0%, 100% {
                width: 80px;
            }
            50% {
                width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Coming Soon<span class="dot">...</span></h1>
        <p>Something amazing is on the way</p>
        <div class="line"></div>
    </div>
</body>
</html>
